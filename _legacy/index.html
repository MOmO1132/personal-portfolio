<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO / 分享卡片（内容来自 content.js，脚本加载后会自动回填 title 与 description） -->
  <title>Momo | 个人作品集</title>
  <meta name="description" content="个人作品集网站" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Momo | 个人作品集" />
  <meta property="og:description" content="个人作品集网站" />

  <!-- 主题偏好预加载：在 CSS 绘制前读取 localStorage，避免主题闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("site-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* 隐私模式下忽略 */ }
    })();
  </script>

  <!-- 在线字体（加载失败时自动回退系统字体，不影响功能） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230c0c0b'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23d7f94e'/%3E%3C/svg%3E" />
</head>

<body>

      <path fill="currentColor" d="M7.6 4.2c.5-.3 1.1.1 1 .7l-.6 2.6 2.5.4c.6.1.8.8.4 1.2L8.7 11l1 3.3c.1.5-.3 1-.8 1l-.5-.1-2.3-1.5-2.2 1.4c-.5.3-1.1 0-1-.6l.9-3.2L2.2 9.5c-.5-.3-.3-1 .2-1.1l2.5-.4-.6-2.5c-.1-.6.5-1.1 1-.8l2.3 1.7 2-1.2zM14.5 3h6c.3 0 .5.2.5.5v5c0 .3-.2.5-.5.5h-6c-.3 0-.5-.2-.5-.5v-5c0-.3.2-.5.5-.5zm.5 1.4v3.2h5V4.4h-5zM13.8 11h7.4c.4 0 .8.4.8.8v7.4c0 .5-.4.8-.8.8h-7.4c-.4 0-.8-.4-.8-.8v-7.4c0-.4.4-.8.8-.8zm1.5 1.5v5.3h4.4v-5.3h-4.4zM3.5 13h6.9c.3 0 .6.3.6.6v5.8c0 .4-.3.6-.6.6H3.5c-.3 0-.6-.3-.6-.6v-5.8c0-.3.3-.6.6-.6zm1 1.2v4.2h4.9v-4.2H4.5z"/>

    </symbol>
  </svg>

  <!-- ============ 顶部导航 ============ -->
  <header class="nav" id="site-nav">
    <div class="container nav-inner">
      <a class="nav-logo" href="#home" aria-label="回到首页">Momo<span>©</span></a>
      <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>
      <div class="nav-actions">
        <button class="theme-btn" id="theme-toggle" aria-label="切换深浅色主题">
          <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"/></svg>
          <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"/></svg>
          <span class="theme-label">深色</span>
        </button>
        <button class="icon-btn nav-burger" id="nav-burger" aria-label="打开菜单" aria-expanded="false">
          <svg class="icon icon-menu" aria-hidden="true"><use href="#icon-menu"/></svg>
          <svg class="icon icon-close" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 移动端全屏菜单 -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true"></div>

  <!-- ============ 主体内容（由各栏目渲染函数填充） ============ -->
  <main>
    <section id="home" class="hero"></section>
    <div class="marquee" id="marquee" aria-hidden="true"></div>
    <section id="about" class="section"></section>
    <section id="projects" class="section"></section>
    <section id="contact" class="section"></section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <button class="to-top" id="to-top" aria-label="返回顶部">
    TOP <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up"/></svg>
  </button>

  <!-- 按顺序加载：内容数据 → 渲染与交互逻辑 -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
